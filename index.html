<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Something I Have to Say</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:      #9c1c32;
    --maroon-deep: #7a1526;
    --gold:        #c9a227;
    --leaf:        #4c7a52;
    --cream:       #faf5ea;
    --ink:         #2b1f18;
    --vh: 1vh;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    font-family:'Poppins', system-ui, sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }

  button{ font-family:inherit; }

  .stage{
    width:100%;
    transition:transform .85s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }

  .scene{
    position:relative;
    width:100%;
    height:100vh;
    height:calc(var(--vh) * 100);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* progress dots */
  .progress{
    position:fixed;
    left:50%;
    top:calc(env(safe-area-inset-top) + 37px);
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:50;
    pointer-events:none;
  }
  .progress span{
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,.35);
    transition:background .4s, transform .4s;
  }
  .progress[data-scene="0"] span:nth-child(1),
  .progress[data-scene="1"] span:nth-child(2),
  .progress[data-scene="2"] span:nth-child(3),
  .progress[data-scene="3"] span:nth-child(4){
    background:var(--gold);
    transform:scale(1.3);
  }
  .progress[data-scene="0"] span{ background:rgba(74,41,26,.25); }
  .progress[data-scene="0"] span:nth-child(1){ background:var(--maroon); }

  /* portal — the "dive into the envelope" transition. Positioned
     absolute within #scene0 (not fixed to the viewport) and placed
     first in that scene's markup, so normal paint order keeps the
     envelope drawn on top of it as it expands — the darkness reads as
     rising up from behind/inside the envelope rather than a sheet
     wiping over the whole screen. */
  .portal{
    position:absolute;
    top:0; left:0;
    width:54px; height:54px;
    margin:-27px 0 0 -27px;
    border-radius:50%;
    background:#050505;
    transform:scale(0);
    opacity:1;
    pointer-events:none;
    transition:transform .8s cubic-bezier(.5,0,.75,.4);
  }
  .portal.expand{ transform:scale(100); }
  @media (prefers-reduced-motion:reduce){
    .portal{ transition:none !important; }
  }

  /* the heart "emerging" from the envelope's opening, growing at the
     seal's position right up until the cut to scene 2 */
  .portal-heart{
    --grow-scale: 2.3; /* overwritten from JS to exactly match the real
                          scene-2 heart's rendered size, so there's no
                          visible size jump at the cut */
    position:absolute;
    top:0; left:0;
    width:70px;
    margin:-35px 0 0 -35px;
    opacity:0;
    transform:scale(.2);
    filter:drop-shadow(0 0 40px rgba(255,40,70,.35)) drop-shadow(0 20px 30px rgba(0,0,0,.6));
    transition:transform .75s cubic-bezier(.3,.75,.35,1), opacity .4s ease-out;
  }
  .portal-heart.grow{
    opacity:1;
    transform:scale(var(--grow-scale));
  }
  @media (prefers-reduced-motion:reduce){
    .portal-heart{ transition:none !important; }
  }

  /* back button */
  .back-btn{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 16px);
    left:calc(env(safe-area-inset-left) + 16px);
    z-index:60;
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.32);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    transition:transform .25s, opacity .25s;
  }
  .back-btn svg{ width:18px; height:18px; }
  .back-btn:hover{ transform:scale(1.07); }
  .back-btn:active{ transform:scale(.94); }
  .back-btn[hidden]{ display:none; }

  /* shared hint / chevron */
  .hint{
    font-size:clamp(11px,2vw,13px);
    letter-spacing:.06em;
    opacity:.75;
    margin:14px 0 0;
  }
  .chevron{
    width:14px; height:14px;
    margin-top:10px;
    border-right:2px solid currentColor;
    border-bottom:2px solid currentColor;
    transform:rotate(45deg);
    opacity:.6;
    animation:chevronBounce 1.6s ease-in-out infinite;
  }
  @keyframes chevronBounce{
    0%,100%{ transform:rotate(45deg) translate(0,0); opacity:.3; }
    50%{ transform:rotate(45deg) translate(4px,4px); opacity:.8; }
  }

  /* ============ SCENE 1 — ENVELOPE ============ */
  .scene-envelope{
    background:radial-gradient(ellipse at 50% 40%, #ffffff, #f3ede0 75%);
  }
  .envelope-stage{
    perspective:1200px;
  }
  .envelope{
    position:relative;
    width:clamp(220px,50vw,340px);
    aspect-ratio:3/2;
  }
  @keyframes envelopeLeave{
    0%{ transform:scale(1); opacity:1; }
    30%{ transform:scale(1.18); opacity:1; }
    55%{ transform:scale(.82); opacity:1; }
    100%{ transform:scale(0); opacity:0; }
  }
  .envelope.leaving{
    animation:envelopeLeave .7s cubic-bezier(.4,0,.2,1) forwards;
  }
  @media (prefers-reduced-motion:reduce){
    .envelope.leaving{ animation:none !important; opacity:0; }
  }
  .envelope-shadow{
    position:absolute;
    left:8%; right:8%; bottom:-14px;
    height:20px;
    background:radial-gradient(ellipse, rgba(74,41,26,.28), transparent 70%);
    filter:blur(2px);
  }
  .envelope-body{
    position:absolute; inset:0;
    background:#f4ecd9;
    border-radius:4px;
    box-shadow:0 18px 40px -12px rgba(74,41,26,.35), 0 2px 4px rgba(74,41,26,.15);
    overflow:hidden;
  }
  .fold{ position:absolute; inset:0; }
  .fold-bottom{ background:#e6d9ba; clip-path:polygon(0 100%,100% 100%,50% 48%); }
  .fold-left{   background:#f0e4c8; clip-path:polygon(0 0,0 100%,50% 48%); }
  .fold-right{  background:#efe2c4; clip-path:polygon(100% 0,100% 100%,50% 48%); }
  .fold-top{
    background:#f8f1de;
    clip-path:polygon(0 0,100% 0,50% 48%);
    transform-origin:50% 0%;
    transition:transform .9s cubic-bezier(.6,.05,.35,1);
    box-shadow:0 3px 6px rgba(74,41,26,.12);
  }
  .envelope.open .fold-top{ transform:rotateX(178deg); }

  .seal-heart{
    position:absolute;
    top:48%; left:50%;
    transform:translate(-50%,-50%);
    width:clamp(56px,12vw,76px);
    height:clamp(56px,12vw,76px);
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 35% 30%, #c94154, var(--maroon-deep) 75%);
    box-shadow:0 6px 16px rgba(122,21,38,.45), inset 0 -3px 6px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
    animation:sealPulse 2.4s ease-in-out infinite;
  }
  .seal-heart svg{ width:52%; height:52%; fill:#fbe9ea; }
  @keyframes sealPulse{
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    50%{ transform:translate(-50%,-50%) scale(1.07); }
  }
  .envelope.open .seal-heart{ animation:none; opacity:0; transition:opacity .4s; pointer-events:none; }

  .envelope-caption{ margin-top:34px; text-align:center; color:var(--ink); }
  .envelope-caption .hint{ text-transform:lowercase; color:var(--maroon-deep); font-weight:500; }

  /* ============ SCENE 2 — BEATING HEART ============ */
  .scene-heart{ background:#050505; color:#f3ece2; }
  .heart-perspective{ perspective:900px; }
  .heart-hit{
    position:relative;
    display:block;
    background:none;
    border:none;
    padding:clamp(20px,5vw,32px);
    margin:0;
    cursor:pointer;
  }
  .heart-wobble{
    animation:heartWobble 2.2s ease-in-out infinite;
    transform-style:preserve-3d;
  }
  .heart-scale{
    display:block;
    width:clamp(150px,32vw,230px);
    animation:heartbeat 1.15s ease-in-out infinite;
    filter:drop-shadow(0 0 40px rgba(255,40,70,.35)) drop-shadow(0 20px 30px rgba(0,0,0,.6));
  }
  @keyframes heartWobble{
    0%,100%{ transform:rotateY(-5deg); }
    50%{ transform:rotateY(5deg); }
  }
  @keyframes heartbeat{
    0%   { transform:scale(1); }
    12%  { transform:scale(1.16); }
    24%  { transform:scale(.97); }
    34%  { transform:scale(1.08); }
    46%  { transform:scale(1); }
    100% { transform:scale(1); }
  }
  .heart-rings{
    position:absolute; top:50%; left:50%; width:0; height:0;
    pointer-events:none;
  }
  .ring{
    position:absolute; top:0; left:0;
    width:clamp(150px,32vw,230px); height:clamp(150px,32vw,230px);
    margin:calc(clamp(150px,32vw,230px) / -2) 0 0 calc(clamp(150px,32vw,230px) / -2);
    border-radius:50%;
    border:1.5px solid rgba(255,60,85,.55);
    opacity:0;
    animation:ringPulse 2.3s ease-out infinite;
  }
  .ring:nth-child(2){ animation-delay:1.15s; }
  @keyframes ringPulse{
    0%{ transform:scale(.75); opacity:.55; }
    100%{ transform:scale(1.55); opacity:0; }
  }

  .heart-quote{
    font-family:'Georgia','Times New Roman',serif;
    font-size:clamp(12px,2.4vw,15px);
    letter-spacing:.09em;
    text-transform:uppercase;
    margin:38px 0 0;
    text-align:center;
    max-width:80vw;
    color:#f7efe6;
  }
  .heart-cta{
    font-family:'Georgia','Times New Roman',serif;
    font-size:clamp(11px,2vw,13px);
    color:#cabfb3;
    margin:10px 0 0;
  }

  @media (prefers-reduced-motion:reduce){
    .heart-wobble, .heart-scale, .ring, .seal-heart, .chevron{ animation:none !important; }
  }

  /* ============ SCENE 3 — BENGALI LETTER ============ */
  .scene-letter{
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,.25), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(120,85,30,.18), transparent 60%),
      #dcc78c;
    padding-top:calc(env(safe-area-inset-top) + 10px);
    padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
  }
  .ink-layer{
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; overflow:hidden; z-index:1;
  }
  .drip{
    position:absolute;
    top:-40px;
    width:6px; height:24px;
    border-radius:50% 50% 60% 60%;
    background:#2a1610;
    opacity:0;
  }
  .scene-letter.active .drip{ animation:dripFall 1.1s cubic-bezier(.55,0,.85,.35) forwards; }
  .drip1{ left:18%; animation-delay:.1s !important; }
  .drip2{ left:47%; animation-delay:.32s !important; }
  .drip3{ left:74%; animation-delay:.55s !important; }
  .drip4{ left:60%; width:4px; height:16px; animation-delay:.75s !important; }
  @keyframes dripFall{
    0%{ opacity:0; transform:translateY(0) scaleY(1); }
    8%{ opacity:.9; }
    70%{ opacity:.9; transform:translateY(46vh) scaleY(1.6); }
    82%{ transform:translateY(48vh) scaleY(.5) scaleX(1.8); opacity:.7; }
    100%{ opacity:0; transform:translateY(48vh) scaleY(.3) scaleX(2.2); }
  }

  .paper{
    position:relative;
    z-index:2;
    width:min(92vw, 560px);
    max-height:82vh;
    overflow-y:auto;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(120,85,30,.10), transparent 45%),
      radial-gradient(ellipse at 90% 95%, rgba(120,85,30,.14), transparent 50%),
      #f2e4b8;
    border:1px solid rgba(74,41,26,.15);
    border-radius:2px;
    box-shadow:0 20px 45px -15px rgba(50,30,10,.5), 0 2px 4px rgba(50,30,10,.15);
    padding:clamp(24px,5vw,44px) clamp(20px,6vw,48px);
    cursor:pointer;
  }
  .letter-text{
    font-family:'Noto Serif Bengali', serif;
    font-weight:700;
    color:#3a2312;
    font-size:clamp(20px,3.6vw,26px);
    line-height:1.85;
  }
  .letter-text p{
    position:relative;
    margin:0 0 1.3em;
    opacity:0;
    transform:translateY(5px);
    background-image:repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(1.85em - 1px),
      rgba(58,35,18,.2) calc(1.85em - 1px), rgba(58,35,18,.2) 1.85em);
  }
  .scene-letter.active .letter-text p{
    animation:inkReveal .7s ease-out forwards;
  }
  .letter-text p:nth-child(1){ animation-delay:.9s !important; }
  .letter-text p:nth-child(2){ animation-delay:1.3s !important; }
  .letter-text p:nth-child(3){ animation-delay:1.7s !important; }
  .letter-text p:nth-child(4){ animation-delay:2.1s !important; }
  @keyframes inkReveal{ to{ opacity:1; transform:translateY(0); } }

  /* per-grapheme "handwriting" reveal — used when the JS segmenter runs;
     see prepareHandwriting() below. Falls back to the paragraph fade
     above when Intl.Segmenter isn't available or motion is reduced. */
  .letter-text p.js-handwritten{
    opacity:1 !important;
    transform:none !important;
    animation:none !important;
  }
  .g{
    display:inline-block;
    opacity:0;
  }
  .scene-letter.active .g{
    animation:inkWrite .25s ease-out forwards;
  }
  @keyframes inkWrite{
    from{ opacity:0; transform:translateY(1.5px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .letter-sign{ text-align:right; margin-top:.6em; }

  .letter-cta{
    display:block;
    text-align:center;
    margin:22px auto 0;
    color:#5a3a1f;
    opacity:0;
    background:none;
    border:none;
    padding:6px 10px;
    cursor:pointer;
  }
  .scene-letter.active .letter-cta{ animation:inkReveal .7s ease-out 2.5s forwards; }

  @media (prefers-reduced-motion:reduce){
    .drip{ display:none; }
    .letter-text p, .letter-cta{ animation:none !important; opacity:1 !important; transform:none !important; }
    .g{ animation:none !important; opacity:1 !important; transform:none !important; }
  }

  /* ============ SCENE 4 — AVATAR ============ */
  .scene-final{
    background:linear-gradient(180deg, #2c1f3e 0%, #6a3552 45%, #c97b6d 78%, #e8b96b 100%);
    color:#fff;
    overflow-y:auto;
    justify-content:flex-start;
    padding-top:calc(env(safe-area-inset-top) + 76px);
    padding-bottom:32px;
  }
  .stars{ position:absolute; inset:0; overflow:hidden; }
  .star{
    position:absolute;
    width:2px; height:2px;
    background:#fff;
    opacity:.5;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.2; } 50%{ opacity:.9; } }

  .avatar-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;
  }
  .pixel-avatar-img{
    width:clamp(160px,32vw,240px);
    height:auto;
    display:block;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.4));
  }

  .chat-cloud{
    position:absolute;
    top:0%;
    right:-10%;
    background:#faf6ec;
    color:#3a2312;
    border-radius:22px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:5px;
    box-shadow:0 10px 24px rgba(0,0,0,.28);
    min-width:56px;
  }
  .chat-tail1, .chat-tail2{
    position:absolute;
    background:#faf6ec;
    border-radius:50%;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  .chat-tail1{ width:14px; height:14px; left:14%; bottom:-16px; }
  .chat-tail2{ width:8px; height:8px; left:6%; bottom:-26px; }

  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:#8a7a63;
    animation:dotBounce 1.3s ease-in-out infinite;
  }
  .dot:nth-child(2){ animation-delay:.18s; }
  .dot:nth-child(3){ animation-delay:.36s; }
  @keyframes dotBounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }

  @media (prefers-reduced-motion:reduce){
    .star, .dot{ animation:none !important; }
  }

  @media (max-width:380px){
    .chat-cloud{ right:-38%; padding:10px 14px; }
  }

  /* reply form — sends straight to Ahnaf via Web3Forms */
  .reply-wrap{
    position:relative;
    z-index:2;
    width:min(90vw, 400px);
    margin-top:clamp(30px,7vh,52px);
  }
  .reply-heading{
    text-align:center;
    font-family:'Georgia','Times New Roman',serif;
    font-style:italic;
    font-size:clamp(15px,2.4vw,18px);
    color:#f6e9dc;
    margin:0 0 16px;
    opacity:.9;
  }
  .reply-form{ display:flex; flex-direction:column; gap:13px; }
  .reply-field label{
    display:block;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:6px;
    color:#eccf94;
  }
  .reply-input-wrap{
    position:relative;
    border-radius:12px;
    padding:1.5px;
    background:rgba(201,162,39,.35);
    transition:background .3s, box-shadow .3s;
  }
  .reply-input-wrap:focus-within{
    background:linear-gradient(135deg,#eccf94,rgba(201,162,39,.75),#eccf94);
    box-shadow:0 0 22px rgba(201,162,39,.3);
  }
  .reply-input-wrap input,
  .reply-input-wrap textarea{
    width:100%;
    padding:11px 14px;
    background:rgba(20,10,22,.78);
    border:none;
    border-radius:10.5px;
    color:#faf6ec;
    font-family:'Poppins', sans-serif;
    font-size:.9rem;
    outline:none;
    display:block;
  }
  .reply-input-wrap input::placeholder,
  .reply-input-wrap textarea::placeholder{ color:rgba(250,246,236,.35); }
  .reply-input-wrap textarea{ min-height:96px; resize:vertical; }

  .reply-submit{
    position:relative;
    overflow:hidden;
    align-self:center;
    margin-top:4px;
    padding:11px 32px;
    background:linear-gradient(100deg,var(--maroon) 0%,var(--gold) 50%,var(--maroon) 100%);
    color:#fff;
    border:none;
    border-radius:100px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:.85rem;
    letter-spacing:.03em;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    transition:transform .25s;
  }
  .reply-submit:hover{ transform:scale(1.05); }
  .reply-submit:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
  .reply-shimmer{
    position:absolute; top:0; left:0;
    width:50%; height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
    animation:replyShimmer 2.6s ease-in-out infinite;
  }
  @keyframes replyShimmer{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(200%); }
  }
  .reply-status{
    font-size:.82rem;
    text-align:center;
    margin-top:2px;
    min-height:1.2em;
  }
  .reply-status.success{ color:#8fd6a8; }
  .reply-status.error{ color:#f2a1a1; }

  @media (prefers-reduced-motion:reduce){
    .reply-shimmer{ animation:none !important; }
  }
</style>
</head>
<body>

<button class="back-btn" id="backBtn" aria-label="Go back" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 L7 12 L15 20"/></svg>
</button>

<div class="progress" id="progress" data-scene="0">
  <span></span><span></span><span></span><span></span>
</div>

<div class="stage" id="stage">

  <!-- ============ SCENE 1 ============ -->
  <section class="scene scene-envelope" id="scene0">
    <!-- sits behind the envelope in normal paint order, so as it expands
         it reads as darkness rising up from behind/inside the envelope,
         rather than a layer painted over the top of it -->
    <div class="portal" id="portal" aria-hidden="true"></div>

    <div class="envelope-stage">
      <div class="envelope" id="envelope">
        <div class="envelope-shadow"></div>
        <div class="envelope-body">
          <div class="fold fold-bottom"></div>
          <div class="fold fold-left"></div>
          <div class="fold fold-right"></div>
          <button class="seal-heart" id="sealHeart" aria-label="Open the envelope">
            <svg viewBox="0 0 24 24"><path d="M12,21.35 L10.55,20.03 C5.4,15.36 2,12.28 2,8.5 C2,5.42 4.42,3 7.5,3 C9.24,3 10.91,3.81 12,5.09 C13.09,3.81 14.76,3 16.5,3 C19.58,3 22,5.42 22,8.5 C22,12.28 18.6,15.36 13.45,20.03 L12,21.35 Z"/></svg>
          </button>
          <div class="fold fold-top"></div>

    </div>
    <div class="envelope-caption">
      <p class="hint">tap the heart</p>
      <div class="chevron" style="margin-left:auto;margin-right:auto;color:#7a1526;"></div>
    </div>

    <!-- the heart that "comes out of" the envelope opening, grown in
         place at the seal's position right before the cut to scene 2 -->
    <div class="portal-heart" id="portalHeart" aria-hidden="true">
      <svg viewBox="0 0 200 190" width="100%">
        <defs>
          <radialGradient id="portalHeartGrad" cx="35%" cy="28%" r="75%">
            <stop offset="0%" stop-color="#ff7a86"/>
            <stop offset="55%" stop-color="#d92e46"/>
            <stop offset="100%" stop-color="#7a0f22"/>
          </radialGradient>
        </defs>
        <path d="M92,10 C90,2 88,-4 84,2 C81,7 84,14 90,18 Z" fill="#8c1226"/>
        <path d="M108,10 C110,2 112,-4 116,2 C119,7 116,14 110,18 Z" fill="#8c1226"/>
        <path d="M100,178 C40,128 10,93 10,60 C10,30 35,8 65,8 C82,8 95,18 100,36 C105,18 118,8 135,8 C165,8 190,30 190,60 C190,93 160,128 100,178 Z" fill="url(#portalHeartGrad)"/>
        <ellipse cx="68" cy="42" rx="26" ry="16" fill="#ffffff" opacity=".22"/>
      </svg>
    </div>
  </section>

  <!-- ============ SCENE 2 ============ -->
  <section class="scene scene-heart" id="scene1" aria-hidden="true">
    <div class="heart-perspective">
      <button class="heart-hit" id="beatingHeart" aria-label="I have something to say to you">
        <div class="heart-rings"><div class="ring"></div><div class="ring"></div></div>
        <div class="heart-wobble">
          <div class="heart-scale">
            <svg viewBox="0 0 200 190" width="100%">
              <defs>
                <radialGradient id="heartGrad" cx="35%" cy="28%" r="75%">
                  <stop offset="0%" stop-color="#ff7a86"/>
                  <stop offset="55%" stop-color="#d92e46"/>
                  <stop offset="100%" stop-color="#7a0f22"/>
                </radialGradient>
              </defs>
              <path d="M92,10 C90,2 88,-4 84,2 C81,7 84,14 90,18 Z" fill="#8c1226"/>
              <path d="M108,10 C110,2 112,-4 116,2 C119,7 116,14 110,18 Z" fill="#8c1226"/>
              <path d="M100,178 C40,128 10,93 10,60 C10,30 35,8 65,8 C82,8 95,18 100,36 C105,18 118,8 135,8 C165,8 190,30 190,60 C190,93 160,128 100,178 Z" fill="url(#heartGrad)"/>
              <ellipse cx="68" cy="42" rx="26" ry="16" fill="#ffffff" opacity=".22"/>
            </svg>
          </div>
        </div>
      </button>
    </div>
    <p class="heart-quote">&ldquo;I have something to say to you&rdquo;</p>
    <p class="heart-cta">click on the heart</p>
  </section>

  <!-- ============ SCENE 3 ============ -->
  <section class="scene scene-letter" id="scene2" aria-hidden="true">
    <div class="ink-layer" aria-hidden="true">
      <div class="drip drip1"></div>
      <div class="drip drip2"></div>
      <div class="drip drip3"></div>
      <div class="drip drip4"></div>
    </div>

    <div class="paper" id="letterPaper">
      <div class="letter-text" lang="bn">
        <p>প্রিয় [Name],</p>
        <p>দু'মাস আগে একবার দেখেছিলাম তোমাকে। তারপর থেকে আর ভুলতে পারিনি।</p>
        <p>জানি না তুমি আমাকে চেনো কিনা, তবু এটা না বলে থাকতে পারলাম না — তোমাকে ভালো লেগেছে, ভীষণভাবে।</p>
        <p class="letter-sign">ইতি,<br>আহনাফ</p>
      </div>
    </div>
    <button class="letter-cta hint" id="letterCta">click on the letter</button>
  </section>

  <!-- ============ SCENE 4 ============ -->
  <section class="scene scene-final" id="scene3" aria-hidden="true">
    <div class="stars" aria-hidden="true" id="stars"></div>

    <div class="avatar-wrap">
      <img class="pixel-avatar-img" src="me.png" alt="Pixel-art illustration of the sender holding a flower">

      <div class="chat-cloud" aria-label="typing">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <div class="chat-tail1"></div>
        <div class="chat-tail2"></div>
      </div>
    </div>

    <div class="reply-wrap">
      <p class="reply-heading">Write back?</p>
      <form class="reply-form" id="replyForm">
        <!-- Web3Forms — same access key/service used on Ahnaf's portfolio
             site, routed to ahnafclash17@gmail.com -->
        <input type="hidden" name="access_key" value="eecb91c7-df3e-459b-b194-7972ccfd29ee">
        <input type="hidden" name="subject" value="A reply to your letter">
        <input type="hidden" name="from_name" value="Letter Day">
        <input type="hidden" name="name" value="Aronima">
        <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

        <div class="reply-field">
          <label for="replyMessage">Your reply <span aria-hidden="true">*</span></label>
          <div class="reply-input-wrap">
            <textarea id="replyMessage" name="message" placeholder="Write back..." required></textarea>
          </div>
        </div>

        <button type="submit" class="reply-submit" id="replySubmit">
          <span class="reply-shimmer"></span>
          <span id="replySubmitLabel">Send reply</span>
        </button>

        <div class="reply-status" id="replyStatus" role="status"></div>
      </form>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var stage    = document.getElementById('stage');
  var scenes   = document.querySelectorAll('.scene');
  var progress = document.getElementById('progress');
  var backBtn  = document.getElementById('backBtn');
  var current  = 0;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setVh(){
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh);
  window.addEventListener('resize', function(){ applyTransform(false); });

  function applyTransform(animate){
    stage.style.transition = animate ? '' : 'none';
    stage.style.transform = 'translateY(-' + (window.innerHeight * current) + 'px)';
    if(!animate){
      // force reflow so the next transform change re-enables the transition
      void stage.offsetHeight;
      stage.style.transition = '';
    }
  }

  function goTo(index, instant){
    if(index === current || index < 0 || index >= scenes.length) return;
    current = index;
    applyTransform(!instant);
    progress.setAttribute('data-scene', String(index));
    backBtn.hidden = (index === 0);
    scenes.forEach(function(s,i){ s.setAttribute('aria-hidden', i === index ? 'false' : 'true'); });
    var activeScene = scenes[index];
    if(activeScene) activeScene.classList.add('active');
    if(index === 0){
      // reset the envelope so it's ready to be opened again
      envelope.classList.remove('open', 'leaving');
      resetPortal();
    }
  }

  backBtn.addEventListener('click', function(){ goTo(current - 1); });

  // ---- Scene 1: envelope ----
  var envelope = document.getElementById('envelope');
  var sealHeart = document.getElementById('sealHeart');
  var portal = document.getElementById('portal');
  var portalHeart = document.getElementById('portalHeart');

  function resetPortal(){
    portal.classList.remove('expand');
    portalHeart.classList.remove('grow');
  }

  sealHeart.addEventListener('click', function(){
    if(envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    var openDelay = reduceMotion ? 100 : 850;

    setTimeout(function(){
      if(reduceMotion){
        goTo(1);
        return;
      }
      // Dive through the envelope's opening: a black disc expands from
      // behind the envelope (see markup order in #scene0) until it
      // covers the screen, while a heart grows at that same spot as if
      // emerging from inside — then we cut to scene 2 (already black,
      // with the same heart waiting) once both are well underway.
      var rect = sealHeart.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      portal.style.left = cx + 'px';
      portal.style.top = cy + 'px';
      portalHeart.style.left = cx + 'px';
      portalHeart.style.top = cy + 'px';

      // Match the grown size exactly to the real scene-2 heart's rendered
      // width (not its live heartbeat-transform width, which pulses) so
      // there's no visible pop at the cut between the two hearts.
      var realHeart = document.querySelector('.heart-scale');
      if(realHeart){
        var realWidth = parseFloat(getComputedStyle(realHeart).width);
        var portalHeartWidth = parseFloat(getComputedStyle(portalHeart).width);
        if(realWidth && portalHeartWidth){
          portalHeart.style.setProperty('--grow-scale', realWidth / portalHeartWidth);
        }
      }

      portal.classList.add('expand');
      envelope.classList.add('leaving');
      setTimeout(function(){ portalHeart.classList.add('grow'); }, 180);

      setTimeout(function(){
        goTo(1, true);
        setTimeout(resetPortal, 100);
      }, 900);
    }, openDelay);
  });

  // ---- Scene 2: beating heart ----
  document.getElementById('beatingHeart').addEventListener('click', function(){
    goTo(2);
  });

  // ---- Scene 3: letter ----
  var letterPaper = document.getElementById('letterPaper');
  function advanceFromLetter(){
    // don't hijack text selection drags
    if(window.getSelection && String(window.getSelection()).length) return;
    goTo(3);
  }
  letterPaper.addEventListener('click', advanceFromLetter);
  document.getElementById('letterCta').addEventListener('click', function(){ goTo(3); });

  // Break the letter into individual graphemes so it reveals character-by-
  // character like it's being handwritten, instead of fading in as whole
  // paragraphs. Uses Intl.Segmenter's grapheme granularity so Bengali
  // conjuncts/matras stay intact as single units — never split mid-glyph.
  (function prepareHandwriting(){
    if(reduceMotion || typeof Intl === 'undefined' || typeof Intl.Segmenter !== 'function'){
      return; // keep the plain paragraph-fade CSS already defined as a fallback
    }
    var graphemeSegmenter = new Intl.Segmenter('bn', { granularity: 'grapheme' });
    var wordSegmenter = new Intl.Segmenter('bn', { granularity: 'word' });
    var paragraphs = document.querySelectorAll('.letter-text p');
    var cursor = 900;   // ms — matches the first paragraph's old fixed delay
    var perChar = 17;   // ms between each letter appearing
    var paraGap = 350;  // ms pause between paragraphs

    paragraphs.forEach(function(p){
      var frag = document.createDocumentFragment();
      Array.prototype.forEach.call(p.childNodes, function(node){
        if(node.nodeType === Node.TEXT_NODE){
          // Split into words first so a line can only break at whitespace —
          // if every letter were its own inline-block, the browser would
          // treat every letter boundary as a break opportunity too, and
          // words would fracture mid-glyph at the end of a line.
          var words = Array.from(wordSegmenter.segment(node.data));
          words.forEach(function(w){
            if(/^\s+$/.test(w.segment)){
              frag.appendChild(document.createTextNode(w.segment));
              cursor += perChar;
              return;
            }
            var atom = document.createElement('span');
            atom.style.display = 'inline-block';
            Array.from(graphemeSegmenter.segment(w.segment)).forEach(function(seg){
              var span = document.createElement('span');
              span.className = 'g';
              span.textContent = seg.segment;
              span.style.animationDelay = cursor + 'ms';
              cursor += perChar;
              atom.appendChild(span);
            });
            frag.appendChild(atom);
          });
        } else {
          frag.appendChild(node.cloneNode(true));
        }
      });
      p.innerHTML = '';
      p.appendChild(frag);
      p.classList.add('js-handwritten');
      cursor += paraGap;
    });

    var letterCta = document.getElementById('letterCta');
    if(letterCta) letterCta.style.animationDelay = (cursor + 250) + 'ms';
  })();

  // ---- Scene 4: twinkling stars ----
  var starsWrap = document.getElementById('stars');
  var starCount = window.innerWidth < 500 ? 26 : 46;
  var starsFrag = document.createDocumentFragment();
  for(var i=0;i<starCount;i++){
    var st = document.createElement('div');
    st.className = 'star';
    st.style.left = (Math.random()*100) + '%';
    st.style.top = (Math.random()*60) + '%';
    st.style.animationDelay = (Math.random()*3) + 's';
    starsFrag.appendChild(st);
  }
  starsWrap.appendChild(starsFrag);

  // ---- Scene 4: reply form (Web3Forms) ----
  var replyForm = document.getElementById('replyForm');
  var replySubmit = document.getElementById('replySubmit');
  var replySubmitLabel = document.getElementById('replySubmitLabel');
  var replyStatus = document.getElementById('replyStatus');

  replyForm.addEventListener('submit', function(e){
    e.preventDefault();
    replySubmit.disabled = true;
    replySubmitLabel.textContent = 'Sending...';
    replyStatus.textContent = '';
    replyStatus.className = 'reply-status';

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(replyForm)
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.success){
          replyStatus.textContent = "Sent! Ahnaf will see it soon.";
          replyStatus.className = 'reply-status success';
          replyForm.reset();
        } else {
          throw new Error(data.message || 'Something went wrong.');
        }
      })
      .catch(function(){
        replyStatus.textContent = 'Failed to send — email ahnafclash17@gmail.com directly instead.';
        replyStatus.className = 'reply-status error';
      })
      .finally(function(){
        replySubmit.disabled = false;
        replySubmitLabel.textContent = 'Send reply';
      });
  });

})();
</script>
</body>
